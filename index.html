<!-- HERO SECTION BACKGROUND -->
<style>
.hero{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.60)),
    url('images/rest-and-roam-luxury-widebeam-shardlow-sunset-hero.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
}

/* SOFT BACKGROUND SECTION */
.soft-background{
  background:
    linear-gradient(rgba(10,18,12,0.72), rgba(10,18,12,0.72)),
    url('images/rest-and-roam-canal-walk-nearby.jpg') center/cover no-repeat;
  padding:130px 0;
}

/* GALLERY IMAGES */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  margin-top:30px;
}

.gallery img{
  height:420px;
  object-fit:cover;
  border-radius:18px;
}
</style>


<!-- GALLERY SECTION -->
<section id="gallery" class="soft-background">
  <div class="container">
    <h2 class="section-title">Luxury Widebeam Gallery</h2>
    <p class="section-sub">
      Explore the widebeam, the waterside setting, and the Shardlow surroundings.
    </p>

    <div class="gallery">
      <img src="images/rest-and-roam-widebeam-under-stone-bridge.jpg" alt="Widebeam passing under stone bridge">

      <img src="images/rest-and-roam-widebeam-lock-sunset.jpg" alt="Luxury widebeam at sunset by the lock">

      <img src="images/rest-and-roam-shardlow-pub-waterside-evening.jpg" alt="Waterside pub near the boat stay">

      <img src="images/rest-and-roam-historic-shardlow-waterfront.jpg" alt="Historic Shardlow waterfront">

      <img src="images/rest-and-roam-canal-walk-nearby.jpg" alt="Canal walk near the mooring">

      <img src="images/rest-and-roam-logo-primary.png" alt="Rest and Roam logo">
    </div>
  </div>
</section>
